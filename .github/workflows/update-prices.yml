name: Fiyat Güncelleme (gram gümüş)

on:
  schedule:
    # Ayın 1'i ve 15'i, 06:00 UTC (~09:00 TR) — yaklaşık 2 haftada bir
    - cron: "0 6 1,15 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Yazmadan sadece hesapla (true/false)"
        required: false
        default: "false"
      simulate_gram:
        description: "Test için sabit gram gümüş değeri (boş = canlı kur)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fiyatları hesapla/güncelle
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          SIMULATE_GRAM: ${{ github.event.inputs.simulate_gram }}
        run: node scripts/update-prices.mjs | tee /tmp/price-log.txt

      - name: Değişiklik varsa commit & push
        id: commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Otomatik fiyat güncellemesi (gram gümüş kuru)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Değişiklik yok, commit atlanıyor."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fiyat değiştiyse e-posta için bildirim (GitHub Issue)
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GRAM=$(grep 'Gram gümüş:' /tmp/price-log.txt | head -1 || true)
          CHANGED=$(grep '(değişti)' /tmp/price-log.txt || true)
          BUGUN=$(date -u +'%Y-%m-%d %H:%M UTC')
          BODY=$(cat <<EOF
          Merhaba @uzelayca-dotcom 👋

          Gümüş kuru yükseldiği için site fiyatları **otomatik güncellendi**. Site birkaç dakika içinde yenilenir — aycataki.com.

          **$GRAM**

          **Değişen ürünler** (ürün · eski → yeni ₺):
          \`\`\`
          $CHANGED
          \`\`\`

          Tarih: $BUGUN

          — Otomatik fiyat güncelleme botu
          EOF
          )
          gh issue create \
            --title "💰 Site fiyatları güncellendi ($(date -u +%Y-%m-%d))" \
            --body "$BODY" \
            --assignee uzelayca-dotcom
